<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drew's Long and Winding Move</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0e17;
            --surface: #1a1826;
            --surface-2: #252336;
            --border: #3d3852;
            --border-subtle: rgba(61,56,82,0.5);
            --text: #f0e6d3;
            --text-2: #c4b8a5;
            --text-3: #9a8f80;
            --blue: #e8a849;
            --blue-glow: rgba(232,168,73,0.15);
            --green: #4ecdc4;
            --green-glow: rgba(78,205,196,0.15);
            --amber: #9b8ec4;
            --amber-glow: rgba(155,142,196,0.15);
            --purple: #8b2252;
            --purple-glow: rgba(139,34,82,0.15);
            --gold: #d4a24e;
            --gold-glow: rgba(212,162,78,0.15);
            --burgundy: #8b2252;
            --burgundy-glow: rgba(139,34,82,0.15);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Psychedelic lava-lamp background ---- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 30% -10%, rgba(212,162,78,0.10), transparent),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139,34,82,0.08), transparent),
                radial-gradient(ellipse 50% 40% at 10% 80%, rgba(155,142,196,0.06), transparent);
            pointer-events: none;
            z-index: 0;
            animation: psycheBg 25s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 70% 20%, rgba(212,162,78,0.07), transparent),
                radial-gradient(ellipse 40% 60% at 20% 60%, rgba(139,34,82,0.06), transparent);
            pointer-events: none;
            z-index: 0;
            animation: psycheBg2 30s ease-in-out infinite alternate;
        }

        @keyframes psycheBg {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05) translateX(2%); }
            100% { opacity: 1; transform: scale(1.1) translateX(-2%); }
        }

        @keyframes psycheBg2 {
            0% { opacity: 0.6; transform: scale(1.1) translateY(-1%); }
            50% { opacity: 1; transform: scale(1) translateY(1%); }
            100% { opacity: 0.7; transform: scale(1.05) translateX(1%); }
        }

        .page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 20px; }

        /* ---- Sgt Pepper decorative top border ---- */
        .page > .hero::before {
            content: '';
            display: block;
            width: 120px;
            height: 3px;
            margin: 0 auto 0;
            background: linear-gradient(90deg, transparent, var(--gold), var(--burgundy), var(--gold), transparent);
            border-radius: 2px;
            opacity: 0.5;
        }

        /* ---- Hero ---- */
        .hero {
            padding: 48px 0 32px;
            text-align: center;
        }

        .hero-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spinRecord 20s linear infinite;
        }

        @keyframes spinRecord {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero h1 {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            position: relative;
            cursor: default;
        }

        .hero h1 .accent {
            background: linear-gradient(135deg, var(--gold), var(--burgundy));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero .subtitle {
            color: var(--text-3);
            font-size: 15px;
            margin-top: 8px;
            font-weight: 400;
        }


        /* ---- Sync Button ---- */
        .sync-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 8px 20px;
            border: 1px solid var(--border-subtle);
            border-radius: 100px;
            background: var(--surface);
            color: var(--text-2);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s, color 0.3s, transform 0.2s;
        }

        .sync-btn:hover {
            border-color: var(--border);
            background: var(--surface-2);
            color: var(--text);
            transform: translateY(-1px);
        }

        .sync-btn:active { transform: translateY(0); }

        .sync-btn svg {
            width: 15px;
            height: 15px;
            transition: transform 0.3s;
        }

        .sync-btn.syncing {
            pointer-events: none;
            color: var(--gold);
            border-color: rgba(212,162,78,0.3);
            background: var(--gold-glow);
        }

        .sync-btn.syncing svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ---- Stats ---- */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, transform 0.2s;
        }

        .stat:hover { border-color: var(--border); transform: translateY(-2px); }

        .stat .num {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .stat .lbl {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-3);
            margin-top: 6px;
        }

        .stat.total .num { color: var(--text); }
        .stat.transit .num { color: var(--blue); }
        .stat.transit::before { content: ''; position: absolute; inset: 0; background: var(--blue-glow); opacity: 0; transition: opacity 0.3s; }
        .stat.transit:hover::before { opacity: 1; }
        .stat.delivered .num { color: var(--green); }
        .stat.delivered::before { content: ''; position: absolute; inset: 0; background: var(--green-glow); opacity: 0; transition: opacity 0.3s; }
        .stat.delivered:hover::before { opacity: 1; }
        .stat.pending .num { color: var(--amber); }
        .stat.pending::before { content: ''; position: absolute; inset: 0; background: var(--amber-glow); opacity: 0; transition: opacity 0.3s; }
        .stat.pending:hover::before { opacity: 1; }

        /* ---- Delivery Calendar ---- */
        .calendar-section {
            margin-bottom: 32px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .calendar-header h2 {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-2);
        }

        .calendar-header .cal-range {
            font-size: 12px;
            color: var(--text-3);
            font-weight: 500;
        }

        .calendar-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface-2) transparent;
        }

        .calendar-strip::-webkit-scrollbar {
            height: 4px;
        }

        .calendar-strip::-webkit-scrollbar-thumb {
            background: var(--surface-2);
            border-radius: 2px;
        }

        .calendar-strip::-webkit-scrollbar-track {
            background: transparent;
        }

        .cal-day {
            flex: 0 0 auto;
            width: 68px;
            padding: 12px 8px;
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s, transform 0.2s, opacity 0.3s;
            position: relative;
            user-select: none;
        }

        .cal-day:hover {
            border-color: var(--border);
            transform: translateY(-2px);
        }

        .cal-day.past {
            opacity: 0.4;
        }

        .cal-day.past:hover {
            opacity: 0.7;
        }

        .cal-day.no-deliveries {
            opacity: 0.35;
        }

        .cal-day.no-deliveries:hover {
            opacity: 0.6;
        }

        .cal-day.today {
            border-color: var(--gold);
            background: var(--gold-glow);
            opacity: 1;
        }

        .cal-day.active {
            border-color: var(--burgundy);
            background: var(--burgundy-glow);
            opacity: 1;
        }

        .cal-day .cal-weekday {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-3);
            line-height: 1;
        }

        .cal-day.today .cal-weekday { color: var(--gold); }

        .cal-day .cal-num {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-top: 4px;
            color: var(--text);
        }

        .cal-day.past .cal-num { color: var(--text-3); }
        .cal-day.today .cal-num { color: var(--gold); }

        .cal-day .cal-month {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-3);
            margin-top: 2px;
            line-height: 1;
        }

        .cal-day .cal-dot-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-top: 8px;
            min-height: 14px;
        }

        .cal-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .cal-dot.in-transit { background: var(--blue); }
        .cal-dot.delivered { background: var(--green); }
        .cal-dot.pending { background: var(--amber); }

        .cal-count {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-2);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ---- Timeline ---- */
        .timeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .timeline-header h2 {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .timeline-header .count {
            font-size: 13px;
            color: var(--text-3);
            font-weight: 500;
        }

        .timeline-header .filter-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--gold);
            background: var(--gold-glow);
            padding: 4px 10px;
            border-radius: 100px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .timeline-header .filter-badge:hover {
            background: rgba(212,162,78,0.25);
        }

        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ---- Package card ---- */
        .pkg {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 0;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
            cursor: default;
        }

        .pkg:hover {
            border-color: var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transform: translateY(-1px);
        }

        .pkg-inner {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 18px 20px;
        }

        /* Carrier icon */
        .carrier {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.02em;
            position: relative;
        }

        .carrier {
            border-radius: 50%;
        }
        .carrier.ups { background: rgba(232,168,73,0.12); color: var(--blue); }
        .carrier.usps { background: rgba(155,142,196,0.12); color: var(--amber); }
        .carrier.fedex { background: rgba(139,34,82,0.12); color: var(--purple); }
        .carrier.amazon { background: rgba(78,205,196,0.12); color: var(--green); }
        .carrier.other { background: var(--surface-2); color: var(--text-3); }

        .carrier svg { width: 22px; height: 22px; }

        .pkg-body { min-width: 0; }

        .pkg-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .pkg-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-3);
        }

        .pkg-meta .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-3);
            opacity: 0.3;
            box-shadow: inset 0 0 0 1.5px var(--surface), inset 0 0 0 0.5px var(--text-3);
            font-size: 0;
            vertical-align: middle;
        }

        .pkg-meta a {
            color: var(--text-2);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            background: var(--surface-2);
            padding: 2px 8px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .pkg-meta a:hover {
            color: var(--gold);
            background: var(--gold-glow);
        }

        /* Item chips */
        .pkg-items {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .item-chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            background: var(--surface-2);
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .item-chip.more {
            color: var(--text-2);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .item-chip.more:hover {
            background: var(--gold-glow);
            color: var(--gold);
        }

        .pkg-right {
            text-align: right;
            flex-shrink: 0;
        }

        /* Status pill */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .pill .dot-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .pill.in-transit { background: var(--blue-glow); color: var(--blue); }
        .pill.in-transit .dot-indicator { background: var(--blue); animation: pulse 2s infinite; }
        .pill.delivered { background: var(--green-glow); color: var(--green); }
        .pill.delivered .dot-indicator { background: var(--green); }
        .pill.pending { background: var(--amber-glow); color: var(--amber); }
        .pill.pending .dot-indicator { background: var(--amber); animation: pulse 3s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .eta {
            font-size: 13px;
            color: var(--text-3);
            margin-top: 6px;
            font-weight: 500;
        }

        .eta strong {
            color: var(--text-2);
            font-weight: 600;
        }

        /* Progress strip at bottom of card — EQ bar style */
        .progress-strip {
            height: 3px;
            background: var(--surface-2);
        }

        .progress-strip .bar {
            height: 100%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-strip .bar.in-transit {
            background: linear-gradient(90deg, var(--gold), var(--burgundy));
        }
        .progress-strip .bar.delivered {
            background: var(--green);
        }
        .progress-strip .bar.pending {
            background: var(--amber);
        }

        /* ---- Abbey Road progress strip for delivered ---- */
        .progress-strip .bar.delivered {
            background: repeating-linear-gradient(
                90deg,
                var(--green) 0px, var(--green) 8px,
                transparent 8px, transparent 12px
            ) !important;
        }

        /* ---- How-to card ---- */
        .how-to {
            margin-top: 32px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
        }

        .how-to .how-title {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 8px;
        }

        .how-to p {
            font-size: 13px;
            color: var(--text-3);
            line-height: 1.6;
        }

        .how-to .email-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-2);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 16px;
            margin-top: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--gold);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .how-to .email-pill:hover {
            border-color: var(--gold);
            background: var(--gold-glow);
        }

        .how-to .email-pill .copy-icon {
            width: 14px;
            height: 14px;
            opacity: 0.5;
        }

        /* ---- Add Package Button ---- */
        .add-pkg-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            margin-left: 10px;
            padding: 8px 20px;
            border: none;
            border-radius: 100px;
            background: linear-gradient(135deg, var(--gold), #c4882e);
            color: #1a1826;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.3s, transform 0.2s, filter 0.3s;
            box-shadow: 0 0 20px rgba(212,162,78,0.3), 0 4px 12px rgba(0,0,0,0.3);
        }

        .add-pkg-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 30px rgba(212,162,78,0.4), 0 6px 20px rgba(0,0,0,0.4);
            filter: brightness(1.1);
        }

        .add-pkg-btn:active { transform: translateY(0); }

        .add-pkg-btn svg {
            width: 15px;
            height: 15px;
        }

        /* ---- Modal Overlay ---- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            width: 100%;
            max-width: 480px;
            margin: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            position: relative;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 60px rgba(212,162,78,0.08);
        }

        .modal-overlay.open .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-2);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-3);
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .modal-close:hover {
            color: var(--text);
            border-color: var(--border);
            background: var(--surface);
        }

        .modal-close svg { width: 16px; height: 16px; }

        .modal-title {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: var(--text-3);
            margin-bottom: 24px;
        }

        /* ---- Package action menu ---- */
        .pkg-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .pkg-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            background: transparent;
            color: var(--text-3);
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
            white-space: nowrap;
        }

        .pkg-action-btn:hover {
            color: var(--text);
            border-color: var(--border);
            background: var(--surface-2);
        }

        .pkg-action-btn.deliver:hover {
            color: var(--green);
            border-color: var(--green);
            background: var(--green-glow);
        }

            font-weight: 600;

            background: var(--gold-glow);
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 6px;
            letter-spacing: 0.03em;
        }

        /* ---- Sgt Pepper star on stat cards ---- */
        .stat::after {
            content: '';
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 16px;
            height: 16px;
            background: currentColor;
            opacity: 0.04;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            transition: opacity 0.3s;
        }
        .stat:hover::after { opacity: 0.1; }

        /* ---- Floating music notes (CSS-only) ---- */
        .page::before,
        .page::after {
            position: fixed;
            font-size: 18px;
            opacity: 0.035;
            pointer-events: none;
            z-index: 0;
            animation: floatNote 20s ease-in-out infinite alternate;
        }
        .page::before {
            content: '\266A';
            top: 15%;
            left: 5%;
        }
        .page::after {
            content: '\266B';
            bottom: 20%;
            right: 6%;
            animation-delay: -10s;
            animation-duration: 25s;
        }
        @keyframes floatNote {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.03; }
            50% { transform: translateY(-20px) rotate(10deg); opacity: 0.06; }
            100% { transform: translateY(5px) rotate(-5deg); opacity: 0.03; }
        }

        /* ---- Yellow Submarine in-transit dot ---- */
        .pill.in-transit .dot-indicator {
            width: 8px;
            height: 5px;
            border-radius: 40% 40% 50% 50%;
            background: var(--blue);
            animation: submarine 3s ease-in-out infinite;
        }
        @keyframes submarine {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        /* ---- Guitar string vibration on in-transit progress bar ---- */
        .progress-strip .bar.in-transit {
            position: relative;
            overflow: visible;
        }
        .progress-strip .bar.in-transit::after {
            content: '';
            position: absolute;
            right: 0;
            top: -1px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold);
            animation: stringVibe 1.5s ease-in-out infinite;
        }
        @keyframes stringVibe {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(-2px); }
            75% { transform: translateY(2px); }
        }

        /* ---- Apple Records silhouette in footer ---- */
        .footer::before {
            content: '';
            display: inline-block;
            width: 14px;
            height: 16px;
            margin-right: 6px;
            vertical-align: -2px;
            background: var(--text-3);
            opacity: 0.4;
            clip-path: polygon(50% 0%, 55% 0%, 58% 5%, 85% 15%, 95% 35%, 98% 55%, 90% 75%, 75% 90%, 55% 100%, 45% 100%, 25% 90%, 10% 75%, 2% 55%, 5% 35%, 15% 15%, 42% 5%, 45% 0%);
        }

        /* ---- Toast notification ---- */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--surface);
            border: 1px solid var(--gold);
            border-radius: var(--radius-sm);
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(212,162,78,0.1);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input::placeholder {
            color: var(--text-3);
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow), 0 0 16px var(--gold-glow);
        }

        .form-group select {
            appearance: none;

            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 36px;
            cursor: pointer;
        }

        .form-group select option {
            background: var(--surface);
            color: var(--text);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .carrier-detected {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--green);
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .carrier-detected.visible {
            opacity: 1;
        }

        .carrier-detected svg { width: 12px; height: 12px; }

        .submit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--gold), #c4882e);
            color: #1a1826;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.3s, transform 0.2s, filter 0.3s;
            box-shadow: 0 0 20px rgba(212,162,78,0.2);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 30px rgba(212,162,78,0.35);
            filter: brightness(1.1);
        }

        .submit-btn:active { transform: translateY(0); }

        .submit-btn svg {
            width: 16px;
            height: 16px;
            vertical-align: -3px;
            margin-right: 6px;
        }

        @media (max-width: 640px) {
            .modal-card { padding: 20px; margin: 12px; }
            .form-row { grid-template-columns: 1fr; }

        }

        /* ---- Add Tracking pill button ---- */
        .add-tracking-btn {
            display: inline-flex;

        }

            border-color: var(--gold);
            background: var(--gold-glow);
        }

            height: 11px;
        }

        /* ---- Footer ---- */

            font-size: 12px;
            color: var(--text-3);
            opacity: 0.5;
        }

        /* ---- Empty state ---- */
        .empty {
            text-align: center;
            padding: 64px 20px;

        }

        .empty p {
            font-size: 14px;
            color: var(--text-3);
        }

        /* ---- Staggered entrance animation ---- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeUp 0.4s ease-out both;

        /* ---- Responsive ---- */

</head>

const LAST_UPDATED = "2026-04-11T17:46:19+00:00";

// Calendar filter state
let calendarFilterDate = null;

function carrierClass(c) {
    c = c.toLowerCase();
    if (c.includes('usps')) return 'usps';
    if (c.includes('ups')) return 'ups';
    if (c.includes('fedex')) return 'fedex';
    if (c.includes('amazon')) return 'amazon';
    return 'other';
}

function carrierIcon(c) {
    c = c.toLowerCase();
    if (c.includes('usps')) return 'USPS';
    if (c.includes('ups')) return 'UPS';
    if (c.includes('fedex')) return 'FDX';
    if (c.includes('amazon')) return 'AMZ';
    return c.substring(0, 3).toUpperCase();
}

function formatDate(dateStr) {
    if (!dateStr) return '<span style="opacity:0.5;font-style:italic">TBD</span>';
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d.getTime())) return '<span style="opacity:0.5;font-style:italic">TBD</span>';
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 86400000);
    const fmt = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (diff === 0) return '<strong>Today</strong>';
    if (diff === 1) return '<strong>Tomorrow</strong>';
    if (diff < 0) return `<strong>${fmt}</strong>`;
    return `<strong>${fmt}</strong> <span style="opacity:0.5">(${diff}d)</span>`;
}

function toDateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function progress(s) {
    if (s === 'delivered') return 100;
    if (s === 'in-transit') return 65;
    return 20;
}

function renderItemChips(items) {
    if (!items || items.length === 0) return '';
    const maxShow = 3;
    const visible = items.slice(0, maxShow);
    const remaining = items.length - maxShow;
    let html = '<div class="pkg-items">';
    visible.forEach(item => {
        html += `<span class="item-chip" title="${item}">${item}</span>`;
    });
    if (remaining > 0) {

    }
    html += '</div>';
    return html;

// ---- localStorage Management ----
const LS_KEY_MANUAL = 'drew_manual_packages';
const LS_KEY_OVERRIDES = 'drew_status_overrides';
const LS_KEY_DELETED = 'drew_deleted_packages';

function getManualPackages() {
    try { return JSON.parse(localStorage.getItem(LS_KEY_MANUAL) || '[]'); } catch { return []; }
}

function saveManualPackages(pkgs) {
    localStorage.setItem(LS_KEY_MANUAL, JSON.stringify(pkgs));
}

function getOverrides() {
    try { return JSON.parse(localStorage.getItem(LS_KEY_OVERRIDES) || '{}'); } catch { return {}; }
}

function saveOverrides(o) {
    localStorage.setItem(LS_KEY_OVERRIDES, JSON.stringify(o));
}

function getDeleted() {
    try { return JSON.parse(localStorage.getItem(LS_KEY_DELETED) || '[]'); } catch { return []; }
}

function saveDeleted(d) {
    localStorage.setItem(LS_KEY_DELETED, JSON.stringify(d));
}

// Unique key for a package (order number preferred, fallback to name)
function pkgKey(p) {
    return p.orderNumber || p.name;
}

// Merge embedded + manual packages, apply overrides, remove deleted
function getAllPackages() {
    const deleted = new Set(getDeleted());
    const overrides = getOverrides();
    const manual = getManualPackages();

    const merged = [];

    // Add synced packages (with overrides applied)
    PACKAGES.forEach(p => {
        const key = pkgKey(p);
        if (deleted.has(key)) return;
        const override = overrides[key];
        const pkg = { ...p };
        if (override) {
            if (override.status) pkg.status = override.status;
            if (override.tracking) pkg.tracking = override.tracking;
            if (override.trackingUrl) pkg.trackingUrl = override.trackingUrl;
            if (override.carrier && override.carrier !== 'Auto-detect') pkg.carrier = override.carrier;
            if (override.estimatedDelivery) pkg.estimatedDelivery = override.estimatedDelivery;
        }
        merged.push(pkg);
    });

    // Add manual packages (not already in synced list)
    const syncedKeys = new Set(PACKAGES.map(pkgKey));
    manual.forEach(p => {
        const key = pkgKey(p);
        if (deleted.has(key) || syncedKeys.has(key)) return;
        merged.push({ ...p, _manual: true });
    });

    return merged;
}

// Toast notification
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

// ---- Status Actions ----
function setStatus(key, status) {
    // Check if it's a manual package
    const manual = getManualPackages();
    const mi = manual.findIndex(p => pkgKey(p) === key);
    if (mi >= 0) {
        manual[mi].status = status;
        saveManualPackages(manual);
    } else {
        const overrides = getOverrides();
        overrides[key] = overrides[key] || {};
        overrides[key].status = status;
        saveOverrides(overrides);
    }
    const labels = { 'delivered': 'Marked as delivered', 'in-transit': 'Marked as in transit', 'pending': 'Marked as pending' };
    showToast(labels[status] || 'Status updated');
    renderAll();
}

function deletePackage(key, name) {
    if (!confirm('Remove "' + name + '" from the tracker?')) return;
    // If manual, remove from manual list
    const manual = getManualPackages();
    const mi = manual.findIndex(p => pkgKey(p) === key);
    if (mi >= 0) {
        manual.splice(mi, 1);
        saveManualPackages(manual);
    } else {
        // For synced packages, add to deleted list
        const deleted = getDeleted();
        if (!deleted.includes(key)) {
            deleted.push(key);
            saveDeleted(deleted);
        }
    }
    showToast('Removed ' + name);
    renderAll();
}

function undoDelete(key) {
    const deleted = getDeleted();
    const i = deleted.indexOf(key);
    if (i >= 0) {
        deleted.splice(i, 1);
        saveDeleted(deleted);
        showToast('Restored');
        renderAll();
    }
}

// ---- Add Package Modal ----
let isUpdateMode = false;
let updatePackageKey = null;

function openAddModal() {
    isUpdateMode = false;
    updatePackageKey = null;
    document.getElementById('addPkgForm').reset();
    document.getElementById('pkgStatus').value = 'pending';
    document.getElementById('carrierDetected').classList.remove('visible');
    document.querySelector('.modal-title').textContent = 'Get Back (with a new package)';
    document.getElementById('modalSubtitle').textContent = 'All you need is love... and a tracking number.';
    document.getElementById('submitBtnText').textContent = 'Add Package';
    document.getElementById('addModal').classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => document.getElementById('pkgName').focus(), 100);
}

function openEditPackage(key) {
    const all = getAllPackages();
    const p = all.find(pkg => pkgKey(pkg) === key);
    if (!p) return;
    isUpdateMode = true;
    updatePackageKey = key;

    document.querySelector('.modal-title').textContent = 'Revolution (edit package)';
    document.getElementById('modalSubtitle').textContent = 'Update details for ' + p.name;
    document.getElementById('submitBtnText').textContent = 'Save Changes';

    document.getElementById('pkgName').value = p.name;
    document.getElementById('pkgTracking').value = p.tracking || '';
    document.getElementById('pkgCarrier').value = p.carrier || 'Auto-detect';
    document.getElementById('pkgStore').value = p.from || '';
    document.getElementById('pkgDelivery').value = p.estimatedDelivery || '';
    document.getElementById('pkgStatus').value = p.status || 'pending';

    document.getElementById('addModal').classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => document.getElementById('pkgName').focus(), 100);
}

function closeAddModal() {
    document.getElementById('addModal').classList.remove('open');
    document.body.style.overflow = '';
    isUpdateMode = false;
    updatePackageKey = null;
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAddModal();
});

function detectCarrier(value) {
    const v = value.trim();
    const select = document.getElementById('pkgCarrier');
    const badge = document.getElementById('carrierDetected');
    const badgeText = document.getElementById('carrierDetectedText');
    let detected = null;

    if (/^1Z/i.test(v) && v.length >= 10) {
        detected = 'UPS';
    } else if (/^(94|93|92|95)\d{18,}/.test(v)) {
        detected = 'USPS';
    } else if (/^TBA/i.test(v)) {
        detected = 'Amazon';
    } else if (/^\d{12,22}$/.test(v)) {
        detected = 'FedEx';
    }

    if (detected) {
        select.value = detected;
        badge.classList.add('visible');
        badgeText.textContent = detected + ' detected';
    } else {
        badge.classList.remove('visible');
    }
}

function buildTrackingUrl(carrier, tracking) {
    if (!tracking) return '';
    const c = carrier.toLowerCase();
    if (c.includes('ups')) return 'https://www.ups.com/track?tracknum=' + tracking;
    if (c.includes('fedex')) return 'https://www.fedex.com/fedextrack/?trknbr=' + tracking;
    if (c.includes('usps')) return 'https://tools.usps.com/go/TrackConfirmAction?tLabels=' + tracking;
    return '';
}

function submitAddPkg(e) {
    e.preventDefault();

    const name = document.getElementById('pkgName').value.trim();
    const tracking = document.getElementById('pkgTracking').value.trim();
    let carrier = document.getElementById('pkgCarrier').value;
    const store = document.getElementById('pkgStore').value.trim();
    const delivery = document.getElementById('pkgDelivery').value;
    const status = document.getElementById('pkgStatus').value;

    if (carrier === 'Auto-detect') carrier = 'Other';

    if (isUpdateMode && updatePackageKey) {
        // Update existing package
        const manual = getManualPackages();
        const mi = manual.findIndex(p => pkgKey(p) === updatePackageKey);
        if (mi >= 0) {
            // Update manual package directly
            manual[mi].name = name;
            manual[mi].tracking = tracking;
            manual[mi].trackingUrl = buildTrackingUrl(carrier, tracking);
            manual[mi].carrier = carrier;
            manual[mi].from = store;
            manual[mi].estimatedDelivery = delivery;
            manual[mi].status = status;
            saveManualPackages(manual);
        } else {
            // Synced package: save overrides
            const overrides = getOverrides();
            overrides[updatePackageKey] = {
                status,
                tracking: tracking || undefined,
                trackingUrl: buildTrackingUrl(carrier, tracking) || undefined,
                carrier: carrier !== 'Other' ? carrier : undefined,
                estimatedDelivery: delivery || undefined
            };
            saveOverrides(overrides);
        }
        showToast('Updated ' + name);
    } else {
        // Add new manual package
        const pkg = {
            name: (store ? store + ' - ' : '') + name,
            carrier,
            tracking,
            trackingUrl: buildTrackingUrl(carrier, tracking),
            status,
            estimatedDelivery: delivery,
            from: store,
            items: [name],
            orderNumber: 'MANUAL-' + Date.now()
        };
        const manual = getManualPackages();
        manual.push(pkg);
        saveManualPackages(manual);
        showToast('Added ' + pkg.name);
    }

    document.getElementById('addPkgForm').reset();
    document.getElementById('carrierDetected').classList.remove('visible');
    closeAddModal();
    renderAll();
}

function toggleCalendarFilter(dateKey) {
    if (calendarFilterDate === dateKey) {
        calendarFilterDate = null;
    } else {
        calendarFilterDate = dateKey;
    }
    renderAll();
}

// ---- Render with merged data ----
function renderAll() {
    renderStats();
    renderCalendar();
    renderPackages();
}

function renderStats() {
    const pkgs = getAllPackages();
    const t = pkgs.length;
    const tr = pkgs.filter(p => p.status === 'in-transit').length;
    const d = pkgs.filter(p => p.status === 'delivered').length;
    const pe = pkgs.filter(p => p.status === 'pending').length;

    document.getElementById('stats').innerHTML = `
        <div class="stat total animate-in" style="animation-delay:0.05s"><div class="num">${t}</div><div class="lbl">Total</div></div>
        <div class="stat transit animate-in" style="animation-delay:0.1s"><div class="num">${tr}</div><div class="lbl">In Transit</div></div>
        <div class="stat delivered animate-in" style="animation-delay:0.15s"><div class="num">${d}</div><div class="lbl">Delivered</div></div>
        <div class="stat pending animate-in" style="animation-delay:0.2s"><div class="num">${pe}</div><div class="lbl">Pending</div></div>
    `;
}

function renderCalendar() {
    const el = document.getElementById('calendar');
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const pkgs = getAllPackages();

    const deliveryMap = {};
    pkgs.forEach(p => {
        const key = p.estimatedDelivery;
        if (!deliveryMap[key]) deliveryMap[key] = [];
        deliveryMap[key].push(p);
    });

    const days = [];
    for (let i = 0; i < 14; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() + i);
        days.push(d);
    }

    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const rangeStart = days[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const rangeEnd = days[days.length - 1].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

    let html = `
        <div class="calendar-section animate-in" style="animation-delay:0.22s">
            <div class="calendar-header">
                <h2>Eight Days a Week</h2>
                <span class="cal-range">${rangeStart} - ${rangeEnd}</span>
            </div>
            <div class="calendar-strip">
    `;

    days.forEach(d => {
        const key = toDateKey(d);
        const isToday = key === toDateKey(today);
        const isPast = d < today;
        const dpkgs = deliveryMap[key] || [];
        const hasDeliveries = dpkgs.length > 0;
        const isActive = calendarFilterDate === key;

        let classes = 'cal-day';
        if (isToday) classes += ' today';
        if (isPast && !isToday) classes += ' past';
        if (!hasDeliveries && !isToday) classes += ' no-deliveries';
        if (isActive) classes += ' active';

        let dotsHtml = '';
        if (hasDeliveries) {
            if (dpkgs.length <= 3) {
                dotsHtml = dpkgs.map(p => `<span class="cal-dot ${p.status}"></span>`).join('');
            } else {
                dotsHtml = `<span class="cal-count">${dpkgs.length}</span>`;
            }
        }

        html += `
            <div class="${classes}" data-date="${key}" onclick="toggleCalendarFilter('${key}')">
                <div class="cal-weekday">${weekdays[d.getDay()]}</div>
                <div class="cal-num">${d.getDate()}</div>
                <div class="cal-month">${months[d.getMonth()]}</div>
                <div class="cal-dot-row">${dotsHtml}</div>
            </div>
        `;
    });

    html += '</div></div>';
    el.innerHTML = html;
}

function renderPackages() {
    const el = document.getElementById('packages');
    const pkgs = getAllPackages();

    let filtered = pkgs;
    if (calendarFilterDate) {
        filtered = pkgs.filter(p => p.estimatedDelivery === calendarFilterDate);
    }

    if (!pkgs.length) {
        el.innerHTML = `<div class="empty"><div class="empty-icon"><img src="drew.jpg" alt="Drew" style="width:40px;height:40px;border-radius:12px;object-fit:cover;object-position:center 15%;opacity:0.7;"></div><h3>Let It Be...</h3><p>Drew's waiting on packages. Forward shipping emails or add one manually.</p></div>`;
        return;
    }

    const order = { 'in-transit': 0, 'pending': 1, 'delivered': 2 };
    const sorted = [...filtered].sort((a, b) => {
        const sd = (order[a.status] ?? 3) - (order[b.status] ?? 3);
        return sd !== 0 ? sd : new Date(a.estimatedDelivery) - new Date(b.estimatedDelivery);
    });

    const filterLabel = calendarFilterDate ? (() => {
        const d = new Date(calendarFilterDate + 'T00:00:00');
        return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    })() : null;

    el.innerHTML = `
        <div class="timeline-header">
            <h2>The Shipping Album</h2>
            <span class="count">
                ${filterLabel
                    ? `<span class="filter-badge" onclick="toggleCalendarFilter('${calendarFilterDate}')">${filterLabel} &times;</span>`
                    : `${pkgs.length} packages`
                }
            </span>
        </div>
        <div class="pkg-list">
            ${sorted.length === 0
                ? `<div class="empty" style="padding:32px 20px"><h3>Nothing to see here</h3><p>Tomorrow never knows... click the date again to show all packages</p></div>`
                : sorted.map((p, i) => {
                    const key = pkgKey(p);
                    const keyEsc = key.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const nameEsc = p.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                    // Build action buttons based on current status
                    let actions = '';
                    if (p.status !== 'delivered') {
                        actions += `<button class="pkg-action-btn deliver" onclick="event.stopPropagation();setStatus('${keyEsc}','delivered')" title="Mark as delivered"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Delivered</button>`;
                    }
                    if (p.status !== 'in-transit') {
                        actions += `<button class="pkg-action-btn transit" onclick="event.stopPropagation();setStatus('${keyEsc}','in-transit')" title="Mark as in transit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>In Transit</button>`;
                    }
                    if (p.status !== 'pending') {
                        actions += `<button class="pkg-action-btn pend" onclick="event.stopPropagation();setStatus('${keyEsc}','pending')" title="Mark as pending"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Pending</button>`;
                    }
                    actions += `<button class="pkg-action-btn" onclick="event.stopPropagation();openEditPackage('${keyEsc}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>`;
                    actions += `<button class="pkg-action-btn delete" onclick="event.stopPropagation();deletePackage('${keyEsc}','${nameEsc}')" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>`;

                    return `
                <div class="pkg animate-in" style="animation-delay:${0.1 + i * 0.06}s">
                    <div class="pkg-inner">
                        <div class="carrier ${carrierClass(p.carrier)}">${carrierIcon(p.carrier)}</div>
                        <div class="pkg-body">
                            <div class="pkg-name">${p.name}${p._manual ? '<span class="manual-badge">MANUAL</span>' : ''}</div>
                            <div class="pkg-meta">
                                <span>${p.carrier}</span>
                                ${p.tracking ? `<span class="dot">&middot;</span><a href="${p.trackingUrl || '#'}" target="_blank" rel="noopener" title="Ticket to Ride">${p.tracking}</a>` : (p.orderNumber && !p.orderNumber.startsWith('MANUAL-') ? `<span class="dot">&middot;</span><span>Order ${p.orderNumber}</span>` : '')}
                            </div>
                            ${renderItemChips(p.items)}
                            <div class="pkg-actions">${actions}</div>
                        </div>
                        <div class="pkg-right">
                            <span class="pill ${p.status}"><span class="dot-indicator"></span>${p.status === 'delivered' ? 'Delivered' : p.status === 'in-transit' ? 'In Transit' : 'Pending'}</span>
                            <div class="eta">${p.status === 'delivered' ? 'Arrived' : 'Est.'} ${formatDate(p.estimatedDelivery)}</div>
                        </div>
                    </div>
                    <div class="progress-strip"><div class="bar ${p.status}" style="width:${progress(p.status)}%"></div></div>
                </div>
            `}).join('')}
        </div>
    `;

    // Bind expand-more handlers
    document.querySelectorAll('.item-chip.more').forEach(chip => {
        chip.addEventListener('click', function(e) {
            e.stopPropagation();
            const container = this.parentElement;
            const pkgCard = container.closest('.pkg');
            const pkgName = pkgCard.querySelector('.pkg-name').textContent.replace('MANUAL', '').trim();
            const all = getAllPackages();
            const pkg = all.find(p => p.name === pkgName);
            if (!pkg) return;
            container.innerHTML = pkg.items.map(item =>
                `<span class="item-chip" title="${item}">${item}</span>`
            ).join('');
        });
    });
}

// 1. Click the record to reverse spin direction
(function() {

// 2. Typing "drew" anywhere triggers a brief golden shimmer
(function() {
    let buffer = '';
    document.addEventListener('keypress', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
        buffer += e.key.toLowerCase();
        if (buffer.length > 10) buffer = buffer.slice(-10);
        if (buffer.endsWith('drew')) {
            buffer = '';
            const shimmer = document.createElement('div');
            shimmer.style.cssText = 'position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,rgba(212,162,78,0.12),transparent 70%);pointer-events:none;z-index:9999;opacity:0;transition:opacity 0.4s;';
            document.body.appendChild(shimmer);
            requestAnimationFrame(() => { shimmer.style.opacity = '1'; });
            setTimeout(() => { shimmer.style.opacity = '0'; setTimeout(() => shimmer.remove(), 500); }, 800);
        }
    });
})();

// 3. Double-click delivered cards for a tiny celebration burst
document.addEventListener('dblclick', function(e) {
    const card = e.target.closest('.pkg');
    if (!card) return;
    const pill = card.querySelector('.pill.delivered');
    if (!pill) return;
    const rect = pill.getBoundingClientRect();
    for (let i = 0; i < 6; i++) {
        const spark = document.createElement('div');
        const angle = (i / 6) * Math.PI * 2;
        const dist = 20 + Math.random() * 15;
        spark.style.cssText = `position:fixed;left:${rect.left + rect.width/2}px;top:${rect.top + rect.height/2}px;width:4px;height:4px;border-radius:50%;background:var(--green);pointer-events:none;z-index:9999;transition:all 0.5s cubic-bezier(0.25,0.46,0.45,0.94);opacity:1;`;
        document.body.appendChild(spark);
        requestAnimationFrame(() => {
            spark.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            spark.style.opacity = '0';
        });
        setTimeout(() => spark.remove(), 600);
    }
});

// 4. Record spindle hole glows on hover
(function() {
    const spindle = document.querySelector('.hero-icon svg circle:last-of-type');
    if (!spindle) return;
    const heroIcon = document.querySelector('.hero-icon');
    heroIcon.addEventListener('mouseenter', () => {
        spindle.setAttribute('filter', 'url(#spindleGlow)');
    });
    heroIcon.addEventListener('mouseleave', () => {
        spindle.removeAttribute('filter');
    });
    // Add glow filter to SVG
    const svg = document.querySelector('.hero-icon svg');
    const defs = svg.querySelector('defs');
    const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    filter.setAttribute('id', 'spindleGlow');
    filter.innerHTML = '<feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(filter);
})();

// 5. Subtle parallax tilt on package cards
document.addEventListener('mousemove', function(e) {
    const cards = document.querySelectorAll('.pkg:hover');
    cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = `translateY(-1px) perspective(600px) rotateY(${x * 1.5}deg) rotateX(${-y * 1.5}deg)`;
    });
});
document.addEventListener('mouseleave', function(e) {
    if (e.target.classList && e.target.classList.contains('pkg')) {
        e.target.style.transform = '';
    }
}, true);
// Reset tilt when mouse leaves card
document.addEventListener('mouseout', function(e) {
    const card = e.target.closest('.pkg');
    if (card && !card.contains(e.relatedTarget)) {
        card.style.transform = '';
    }
});
