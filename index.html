<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drew's Move</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --surface-2: #27272a;
            --border: #3f3f46;
            --border-subtle: rgba(63,63,70,0.5);
            --text: #fafafa;
            --text-2: #a1a1aa;
            --text-3: #71717a;
            --blue: #3b82f6;
            --blue-glow: rgba(59,130,246,0.15);
            --green: #22c55e;
            --green-glow: rgba(34,197,94,0.15);
            --amber: #f59e0b;
            --amber-glow: rgba(245,158,11,0.15);
            --purple: #a855f7;
            --purple-glow: rgba(168,85,247,0.15);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Animated grain background ---- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(59,130,246,0.08), transparent),
                        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168,85,247,0.06), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 20px; }

        /* ---- Hero ---- */
        .hero {
            padding: 48px 0 32px;
            text-align: center;
        }

        .hero-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 40px rgba(59,130,246,0.2), 0 0 80px rgba(168,85,247,0.1);
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .hero h1 .accent {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero .subtitle {
            color: var(--text-3);
            font-size: 15px;
            margin-top: 8px;
            font-weight: 400;
        }

        /* ---- Sync Button ---- */
        .sync-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 8px 20px;
            border: 1px solid var(--border-subtle);
            border-radius: 100px;
            background: var(--surface);
            color: var(--text-2);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s, color 0.3s, transform 0.2s;
        }

        .sync-btn:hover {
            border-color: var(--border);
            background: var(--surface-2);
            color: var(--text);
            transform: translateY(-1px);
        }

        .sync-btn:active { transform: translateY(0); }

        .sync-btn svg {
            width: 15px;
            height: 15px;
            transition: transform 0.3s;
        }

        .sync-btn.syncing {
            pointer-events: none;
            color: var(--blue);
            border-color: rgba(59,130,246,0.3);
            background: var(--blue-glow);
        }

        .sync-btn.syncing svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ---- Stats ---- */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s, transform 0.2s;
        }

        .stat:hover { border-color: var(--border); transform: translateY(-2px); }

        .stat .num {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .stat .lbl {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-3);
            margin-top: 6px;
        }

        .stat.total .num { color: var(--text); }
        .stat.transit .num { color: var(--blue); }
        .stat.transit::before { content: ''; position: absolute; inset: 0; background: var(--blue-glow); opacity: 0; transition: opacity 0.3s; }
        .stat.transit:hover::before { opacity: 1; }
        .stat.delivered .num { color: var(--green); }
        .stat.delivered::before { content: ''; position: absolute; inset: 0; background: var(--green-glow); opacity: 0; transition: opacity 0.3s; }
        .stat.delivered:hover::before { opacity: 1; }
        .stat.pending .num { color: var(--amber); }
        .stat.pending::before { content: ''; position: absolute; inset: 0; background: var(--amber-glow); opacity: 0; transition: opacity 0.3s; }
        .stat.pending:hover::before { opacity: 1; }

        /* ---- Delivery Calendar ---- */
        .calendar-section {
            margin-bottom: 32px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .calendar-header h2 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-2);
        }

        .calendar-header .cal-range {
            font-size: 12px;
            color: var(--text-3);
            font-weight: 500;
        }

        .calendar-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface-2) transparent;
        }

        .calendar-strip::-webkit-scrollbar {
            height: 4px;
        }

        .calendar-strip::-webkit-scrollbar-thumb {
            background: var(--surface-2);
            border-radius: 2px;
        }

        .calendar-strip::-webkit-scrollbar-track {
            background: transparent;
        }

        .cal-day {
            flex: 0 0 auto;
            width: 68px;
            padding: 12px 8px;
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s, transform 0.2s, opacity 0.3s;
            position: relative;
            user-select: none;
        }

        .cal-day:hover {
            border-color: var(--border);
            transform: translateY(-2px);
        }

        .cal-day.past {
            opacity: 0.4;
        }

        .cal-day.past:hover {
            opacity: 0.7;
        }

        .cal-day.no-deliveries {
            opacity: 0.35;
        }

        .cal-day.no-deliveries:hover {
            opacity: 0.6;
        }

        .cal-day.today {
            border-color: var(--blue);
            background: var(--blue-glow);
            opacity: 1;
        }

        .cal-day.active {
            border-color: var(--purple);
            background: var(--purple-glow);
            opacity: 1;
        }

        .cal-day .cal-weekday {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-3);
            line-height: 1;
        }

        .cal-day.today .cal-weekday { color: var(--blue); }

        .cal-day .cal-num {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-top: 4px;
            color: var(--text);
        }

        .cal-day.past .cal-num { color: var(--text-3); }
        .cal-day.today .cal-num { color: var(--blue); }

        .cal-day .cal-month {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-3);
            margin-top: 2px;
            line-height: 1;
        }

        .cal-day .cal-dot-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-top: 8px;
            min-height: 14px;
        }

        .cal-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .cal-dot.in-transit { background: var(--blue); }
        .cal-dot.delivered { background: var(--green); }
        .cal-dot.pending { background: var(--amber); }

        .cal-count {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-2);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ---- Timeline ---- */
        .timeline-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .timeline-header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .timeline-header .count {
            font-size: 13px;
            color: var(--text-3);
            font-weight: 500;
        }

        .timeline-header .filter-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--purple);
            background: var(--purple-glow);
            padding: 4px 10px;
            border-radius: 100px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .timeline-header .filter-badge:hover {
            background: rgba(168,85,247,0.25);
        }

        .pkg-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ---- Package card ---- */
        .pkg {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 0;
            overflow: hidden;
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
            cursor: default;
        }

        .pkg:hover {
            border-color: var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transform: translateY(-1px);
        }

        .pkg-inner {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 18px 20px;
        }

        /* Carrier icon */
        .carrier {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.02em;
            position: relative;
        }

        .carrier.ups { background: rgba(245,158,11,0.12); color: var(--amber); }
        .carrier.usps { background: rgba(59,130,246,0.12); color: var(--blue); }
        .carrier.fedex { background: rgba(168,85,247,0.12); color: var(--purple); }
        .carrier.amazon { background: rgba(34,197,94,0.12); color: var(--green); }
        .carrier.other { background: var(--surface-2); color: var(--text-3); }

        .carrier svg { width: 22px; height: 22px; }

        .pkg-body { min-width: 0; }

        .pkg-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .pkg-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-3);
        }

        .pkg-meta .dot { opacity: 0.3; }

        .pkg-meta a {
            color: var(--text-2);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            background: var(--surface-2);
            padding: 2px 8px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .pkg-meta a:hover {
            color: var(--blue);
            background: var(--blue-glow);
        }

        /* Item chips */
        .pkg-items {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .item-chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            background: var(--surface-2);
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .item-chip.more {
            color: var(--text-2);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .item-chip.more:hover {
            background: var(--blue-glow);
            color: var(--blue);
        }

        .pkg-right {
            text-align: right;
            flex-shrink: 0;
        }

        /* Status pill */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .pill .dot-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .pill.in-transit { background: var(--blue-glow); color: var(--blue); }
        .pill.in-transit .dot-indicator { background: var(--blue); animation: pulse 2s infinite; }
        .pill.delivered { background: var(--green-glow); color: var(--green); }
        .pill.delivered .dot-indicator { background: var(--green); }
        .pill.pending { background: var(--amber-glow); color: var(--amber); }
        .pill.pending .dot-indicator { background: var(--amber); animation: pulse 3s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .eta {
            font-size: 13px;
            color: var(--text-3);
            margin-top: 6px;
            font-weight: 500;
        }

        .eta strong {
            color: var(--text-2);
            font-weight: 600;
        }

        /* Progress strip at bottom of card */
        .progress-strip {
            height: 2px;
            background: var(--surface-2);
        }

        .progress-strip .bar {
            height: 100%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-strip .bar.in-transit {
            background: linear-gradient(90deg, var(--blue), var(--purple));
        }
        .progress-strip .bar.delivered {
            background: var(--green);
        }
        .progress-strip .bar.pending {
            background: var(--amber);
        }

        /* ---- How-to card ---- */
        .how-to {
            margin-top: 32px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
        }

        .how-to .how-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 8px;
        }

        .how-to p {
            font-size: 13px;
            color: var(--text-3);
            line-height: 1.6;
        }

        .how-to .email-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-2);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 8px 16px;
            margin-top: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--blue);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .how-to .email-pill:hover {
            border-color: var(--blue);
            background: var(--blue-glow);
        }

        .how-to .email-pill .copy-icon {
            width: 14px;
            height: 14px;
            opacity: 0.5;
        }

        /* ---- Footer ---- */
        .footer {
            text-align: center;
            padding: 32px 0 48px;
            font-size: 12px;
            color: var(--text-3);
            opacity: 0.5;
        }

        /* ---- Empty state ---- */
        .empty {
            text-align: center;
            padding: 64px 20px;
        }

        .empty-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .empty h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 6px;
        }

        .empty p {
            font-size: 14px;
            color: var(--text-3);
        }

        /* ---- Staggered entrance animation ---- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeUp 0.4s ease-out both;
        }

        /* ---- Responsive ---- */
        @media (max-width: 640px) {
            .hero { padding: 32px 0 24px; }
            .hero h1 { font-size: 28px; }
            .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stat { padding: 16px; }
            .stat .num { font-size: 24px; }
            .pkg-inner { grid-template-columns: 48px 1fr; gap: 12px; padding: 14px 16px; }
            .pkg-right { grid-column: 1 / -1; text-align: left; display: flex; align-items: center; gap: 12px; }
            .cal-day { width: 58px; padding: 10px 6px; }
            .cal-day .cal-num { font-size: 17px; }
            .item-chip { max-width: 180px; }
        }
    </style>
</head>
<body>

<div class="page">
    <div class="hero animate-in">
        <div class="hero-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="3" width="15" height="13"/>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
                <circle cx="5.5" cy="18.5" r="2.5"/>
                <circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
        </div>
        <h1><span class="accent">Drew's</span> Move</h1>
        <p class="subtitle">Every package, one dashboard</p>
        <button class="sync-btn" id="syncBtn" onclick="handleSync()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
            <span class="sync-label">Sync Now</span>
        </button>
    </div>

    <div id="stats" class="stats"></div>
    <div id="calendar"></div>
    <div id="packages"></div>

    <div class="how-to animate-in" style="animation-delay: 0.3s">
        <div class="how-title">Add packages</div>
        <p>Forward any shipping or tracking email to</p>
        <div class="email-pill" onclick="navigator.clipboard.writeText('mwhite57+drewshipping@gmail.com').then(()=>{this.querySelector('.copy-text').textContent='Copied!'})">
            <span class="copy-text">mwhite57+drewshipping@gmail.com</span>
            <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
        </div>
    </div>

    <div class="footer" id="footer"></div>
</div>

<script>
const PACKAGES = [
    {
        name: "Amazon - Kitchen Essentials Box",
        carrier: "Amazon",
        tracking: "TBA934857201000",
        trackingUrl: "https://www.amazon.com/gp/your-account/order-history",
        status: "in-transit",
        estimatedDelivery: "2026-03-18",
        from: "Amazon",
        items: ["OXO Good Grips Utensil Set", "Instant Pot Duo 7-in-1", "Brita Water Filter Pitcher"]
    },
    {
        name: "IKEA KALLAX Shelf Unit",
        carrier: "UPS",
        tracking: "1Z999AA10123456784",
        trackingUrl: "https://www.ups.com/track?tracknum=1Z999AA10123456784",
        status: "in-transit",
        estimatedDelivery: "2026-03-19",
        from: "IKEA",
        items: ["KALLAX Shelf Unit 4x2 White"]
    },
    {
        name: "Wayfair Couch (3-piece sectional)",
        carrier: "FedEx",
        tracking: "794644790132",
        trackingUrl: "https://www.fedex.com/fedextrack/?trknbr=794644790132",
        status: "pending",
        estimatedDelivery: "2026-03-22",
        from: "Wayfair",
        items: ["Honbay Reversible Sectional Sofa - Dark Grey"]
    },
    {
        name: "USPS - Mail Forwarding Bundle",
        carrier: "USPS",
        tracking: "9400111899223100012345",
        trackingUrl: "https://tools.usps.com/go/TrackConfirmAction?tLabels=9400111899223100012345",
        status: "delivered",
        estimatedDelivery: "2026-03-16",
        from: "USPS",
        items: ["Forwarded Mail Bundle"]
    },
    {
        name: "Home Depot - Curtain Rods + Hardware",
        carrier: "UPS",
        tracking: "1Z999AA10987654321",
        trackingUrl: "https://www.ups.com/track?tracknum=1Z999AA10987654321",
        status: "in-transit",
        estimatedDelivery: "2026-03-20",
        from: "Home Depot",
        items: ["Umbra Twilight Double Curtain Rod 66-120in", "Heavy Duty Wall Anchors 50pk", "3M Command Hooks Variety Pack"]
    }
];

const LAST_UPDATED = "2026-03-17T12:00:00Z";

// Calendar filter state
let calendarFilterDate = null;

function carrierClass(c) {
    c = c.toLowerCase();
    if (c.includes('usps')) return 'usps';
    if (c.includes('ups')) return 'ups';
    if (c.includes('fedex')) return 'fedex';
    if (c.includes('amazon')) return 'amazon';
    return 'other';
}

function carrierIcon(c) {
    c = c.toLowerCase();
    if (c.includes('usps')) return 'USPS';
    if (c.includes('ups')) return 'UPS';
    if (c.includes('fedex')) return 'FDX';
    if (c.includes('amazon')) return 'AMZ';
    return c.substring(0, 3).toUpperCase();
}

function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 86400000);
    const fmt = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    if (diff === 0) return '<strong>Today</strong>';
    if (diff === 1) return '<strong>Tomorrow</strong>';
    if (diff < 0) return `<strong>${fmt}</strong>`;
    return `<strong>${fmt}</strong> <span style="opacity:0.5">(${diff}d)</span>`;
}

function toDateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function progress(s) {
    if (s === 'delivered') return 100;
    if (s === 'in-transit') return 65;
    return 20;
}

function renderItemChips(items) {
    if (!items || items.length === 0) return '';
    const maxShow = 3;
    const visible = items.slice(0, maxShow);
    const remaining = items.length - maxShow;
    let html = '<div class="pkg-items">';
    visible.forEach(item => {
        html += `<span class="item-chip" title="${item}">${item}</span>`;
    });
    if (remaining > 0) {
        html += `<span class="item-chip more" onclick="this.parentElement.dataset.expanded = 'true'; this.remove(); renderExpandedItems(this.parentElement, ${JSON.stringify(items).replace(/"/g, '&quot;')})">+${remaining} more</span>`;
    }
    html += '</div>';
    return html;
}

function renderExpandedItems(container, items) {
    // Handled inline via onclick below
}

// Sync button handler
function handleSync() {
    const btn = document.getElementById('syncBtn');
    btn.classList.add('syncing');
    btn.querySelector('.sync-label').textContent = 'Syncing...';
    setTimeout(() => {
        btn.classList.remove('syncing');
        btn.querySelector('.sync-label').textContent = 'Sync Now';
    }, 2000);
}

// Render stats
function renderStats() {
    const t = PACKAGES.length;
    const tr = PACKAGES.filter(p => p.status === 'in-transit').length;
    const d = PACKAGES.filter(p => p.status === 'delivered').length;
    const pe = PACKAGES.filter(p => p.status === 'pending').length;

    document.getElementById('stats').innerHTML = `
        <div class="stat total animate-in" style="animation-delay:0.05s"><div class="num">${t}</div><div class="lbl">Total</div></div>
        <div class="stat transit animate-in" style="animation-delay:0.1s"><div class="num">${tr}</div><div class="lbl">In Transit</div></div>
        <div class="stat delivered animate-in" style="animation-delay:0.15s"><div class="num">${d}</div><div class="lbl">Delivered</div></div>
        <div class="stat pending animate-in" style="animation-delay:0.2s"><div class="num">${pe}</div><div class="lbl">Pending</div></div>
    `;
}

// Render calendar
function renderCalendar() {
    const el = document.getElementById('calendar');
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    // Build delivery map: dateKey -> array of packages
    const deliveryMap = {};
    PACKAGES.forEach(p => {
        const key = p.estimatedDelivery;
        if (!deliveryMap[key]) deliveryMap[key] = [];
        deliveryMap[key].push(p);
    });

    // Generate 14 days starting from today
    const days = [];
    for (let i = 0; i < 14; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() + i);
        days.push(d);
    }

    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    const rangeStart = days[0].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const rangeEnd = days[days.length - 1].toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

    let html = `
        <div class="calendar-section animate-in" style="animation-delay:0.22s">
            <div class="calendar-header">
                <h2>Delivery Calendar</h2>
                <span class="cal-range">${rangeStart} - ${rangeEnd}</span>
            </div>
            <div class="calendar-strip">
    `;

    days.forEach(d => {
        const key = toDateKey(d);
        const isToday = key === toDateKey(today);
        const isPast = d < today;
        const pkgs = deliveryMap[key] || [];
        const hasDeliveries = pkgs.length > 0;
        const isActive = calendarFilterDate === key;

        let classes = 'cal-day';
        if (isToday) classes += ' today';
        if (isPast && !isToday) classes += ' past';
        if (!hasDeliveries && !isToday) classes += ' no-deliveries';
        if (isActive) classes += ' active';

        let dotsHtml = '';
        if (hasDeliveries) {
            if (pkgs.length <= 3) {
                dotsHtml = pkgs.map(p => `<span class="cal-dot ${p.status}"></span>`).join('');
            } else {
                dotsHtml = `<span class="cal-count">${pkgs.length}</span>`;
            }
        }

        html += `
            <div class="${classes}" data-date="${key}" onclick="toggleCalendarFilter('${key}')">
                <div class="cal-weekday">${weekdays[d.getDay()]}</div>
                <div class="cal-num">${d.getDate()}</div>
                <div class="cal-month">${months[d.getMonth()]}</div>
                <div class="cal-dot-row">${dotsHtml}</div>
            </div>
        `;
    });

    html += '</div></div>';
    el.innerHTML = html;
}

function toggleCalendarFilter(dateKey) {
    if (calendarFilterDate === dateKey) {
        calendarFilterDate = null;
    } else {
        calendarFilterDate = dateKey;
    }
    renderCalendar();
    renderPackages();
}

// Render packages
function renderPackages() {
    const el = document.getElementById('packages');

    let filtered = PACKAGES;
    if (calendarFilterDate) {
        filtered = PACKAGES.filter(p => p.estimatedDelivery === calendarFilterDate);
    }

    if (!PACKAGES.length) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">&#128230;</div><h3>No packages yet</h3><p>Forward shipping emails to get started</p></div>`;
        return;
    }

    const order = { 'in-transit': 0, 'pending': 1, 'delivered': 2 };
    const sorted = [...filtered].sort((a, b) => {
        const sd = (order[a.status] ?? 3) - (order[b.status] ?? 3);
        return sd !== 0 ? sd : new Date(a.estimatedDelivery) - new Date(b.estimatedDelivery);
    });

    const filterLabel = calendarFilterDate ? (() => {
        const d = new Date(calendarFilterDate + 'T00:00:00');
        return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    })() : null;

    el.innerHTML = `
        <div class="timeline-header">
            <h2>Shipments</h2>
            <span class="count">
                ${filterLabel
                    ? `<span class="filter-badge" onclick="toggleCalendarFilter('${calendarFilterDate}')">${filterLabel} &times;</span>`
                    : `${PACKAGES.length} packages`
                }
            </span>
        </div>
        <div class="pkg-list">
            ${sorted.length === 0
                ? `<div class="empty" style="padding:32px 20px"><h3>No deliveries on this day</h3><p>Click the date again to show all packages</p></div>`
                : sorted.map((p, i) => `
                <div class="pkg animate-in" style="animation-delay:${0.1 + i * 0.06}s">
                    <div class="pkg-inner">
                        <div class="carrier ${carrierClass(p.carrier)}">${carrierIcon(p.carrier)}</div>
                        <div class="pkg-body">
                            <div class="pkg-name">${p.name}</div>
                            <div class="pkg-meta">
                                <span>${p.carrier}</span>
                                <span class="dot">&middot;</span>
                                <a href="${p.trackingUrl}" target="_blank" rel="noopener">${p.tracking}</a>
                            </div>
                            ${renderItemChips(p.items)}
                        </div>
                        <div class="pkg-right">
                            <span class="pill ${p.status}"><span class="dot-indicator"></span>${p.status.replace('-', ' ')}</span>
                            <div class="eta">${p.status === 'delivered' ? 'Arrived' : 'Est.'} ${formatDate(p.estimatedDelivery)}</div>
                        </div>
                    </div>
                    <div class="progress-strip"><div class="bar ${p.status}" style="width:${progress(p.status)}%"></div></div>
                </div>
            `).join('')}
        </div>
    `;

    // Bind expand-more handlers
    document.querySelectorAll('.item-chip.more').forEach(chip => {
        chip.addEventListener('click', function(e) {
            e.stopPropagation();
            const container = this.parentElement;
            const pkgCard = container.closest('.pkg');
            const pkgName = pkgCard.querySelector('.pkg-name').textContent;
            const pkg = PACKAGES.find(p => p.name === pkgName);
            if (!pkg) return;
            container.innerHTML = pkg.items.map(item =>
                `<span class="item-chip" title="${item}">${item}</span>`
            ).join('');
        });
    });
}

renderStats();
renderCalendar();
renderPackages();
document.getElementById('footer').textContent = `Last synced ${new Date(LAST_UPDATED).toLocaleString()}`;
</script>
